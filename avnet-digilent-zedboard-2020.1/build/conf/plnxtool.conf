
#Add Pre-mirrors from petalinux-config
PREMIRRORS = " git://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2020/downloads \n \
ftp://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2020/downloads \n \
http://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2020/downloads \n \
https://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2020/downloads \n"


#Sttate mirror settings
SSTATE_MIRRORS = "  \
file://.* http://petalinux.xilinx.com/sswreleases/rel-v2020/arm/sstate-cache/PATH;downloadfilename=PATH \n \
"

SIGGEN_UNLOCKED_RECIPES += "arm-trusted-firmware busybox init-ifupdown python3"


MACHINE = "zedboard-zynq7"
PACKAGE_CLASSES = "package_rpm"
DL_DIR = "${TOPDIR}/downloads"
SSTATE_DIR = "${TOPDIR}/sstate-cache"
XILINX_SDK_TOOLCHAIN = "/remote/petalinux/tools/xsct/"
USE_XSCT_TARBALL = "0"
IMAGE_LINGUAS = " "
TMPDIR = "/tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/build/tmp"
hostname_pn-base-files = "avnet-digilent-zedboard-2020_1"
PETALINUX_PRODUCT_pn-base-files = "avnet-digilent-zedboard-2020.1"
PETALINUX_VERSION_pn-base-files = "1.00"












# Add system HDF/DSA
HDF_EXT_forcevariable = "xsa"
HDF_BASE_forcevariable = "file://"
HDF_PATH_forcevariable = "/tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/project-spec/hw-description/system.xsa"

SYSCONFIG_PATH = "/tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/project-spec/configs"


#u-boot-xlnx variables

#linux-xlnx variables
RDEPENDS_${KERNEL_PACKAGE_NAME}-base_pn-linux-xlnx = ""

#device-tree variables
XSCTH_WS_pn-device-tree = "${SYSCONFIG_PATH}/../../components/plnx_workspace/device-tree"
YAML_CONSOLE_DEVICE_CONFIG_zedboard-zynq7_pn-device-tree = "ps7_uart_1"
YAML_MAIN_MEMORY_CONFIG_zedboard-zynq7_pn-device-tree = "PS7_DDR_0"
FILESEXTRAPATHS_prepend_pn-device-tree := "${SYSCONFIG_PATH}:"
SRC_URI_append_pn-device-tree = " file://config"
DT_PADDING_SIZE_pn-device-tree = "0x1000"
DTC_FLAGS_pn-device-tree += "-@"
KERNEL_DTS_INCLUDE_pn-device-tree = "${STAGING_KERNEL_DIR}/include"

#busybox variables
FILESEXTRAPATHS_prepend_pn-busybox := "${SYSCONFIG_PATH}/busybox:"

#init-ifupdown variables
FILESEXTRAPATHS_prepend_pn-init-ifupdown := "${SYSCONFIG_PATH}/init-ifupdown:"

#fsbl variables
compilerflags_pn-pn-fsbl = ""
YAML_COMPILER_FLAGS_append_pn-fsbl = " ${compilerflags}"
YAML_SERIAL_CONSOLE_STDIN_zedboard-zynq7_pn-fsbl = "ps7_uart_1"
YAML_SERIAL_CONSOLE_STDOUT_zedboard-zynq7_pn-fsbl = "ps7_uart_1"

#Add Kernel image
KERNEL_IMAGETYPE = "zImage"
KERNEL_EXTRA_ARGS_append = " UIMAGE_LOADADDR=0x200000"
KERNEL_ALT_IMAGETYPE = "uImage"

#Add FIT Variables
KERNEL_CLASSES_append = " kernel-fitimage"
KERNEL_IMAGETYPES_append = " fitImage vmlinux"
UBOOT_ENTRYPOINT  = "0x200000"
UBOOT_LOADADDRESS = "0x200000"

DDR_BASEADDR = "0x0"
INITRAMFS_IMAGE = "petalinux-image-minimal"

EXTRA_IMAGEDEPENDS_append = " virtual/bootloader virtual/fsbl u-boot-zynq-scr"
SPL_BINARY = ""
EXTRA_IMAGEDEPENDS_remove = "virtual/boot-bin "
YAML_DT_BOARD_FLAGS_forcevariable = "{BOARD zedboard}"

IMAGE_FSTYPES_forcevariable = "cpio cpio.gz cpio.gz.u-boot tar.gz jffs2"
SERIAL_CONSOLES = "115200;ttyPS0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"
#SDK variables
SDK_EXT_TYPE = "minimal"
SDK_INCLUDE_BUILDTOOLS = "0"
SDK_LAYERS_EXCLUDE_append = " /tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/project-spec/meta-user"

# deploy class variables
PLNX_DEPLOY_DIR = "/tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/images/linux"
PACKAGE_DTB_NAME = "system.dtb"
PACKAGE_FITIMG_NAME = "image.ub"
EXTRA_FILESLIST = "/tmp/cpre488-mp3/avnet-digilent-zedboard-2020.1/project-spec/hw-description/sw_btn_led_wrapper.bit:system.bit"

#Rootfs configs
INHERIT += "plnx-deploy extrausers "

IMAGE_AUTOLOGIN = "0"

COMMON_FEATURES_zynq = "\
		ssh-server-dropbear \
		hwcodecs \
		debug-tweaks \
		"
IMAGE_LINGUAS_zynq = " "

IMAGE_INSTALL_zynq = "\
		kernel-modules \
		fpga-manager-script \
		haveged \
		mtd-utils \
		can-utils \
		openssh-sftp-server \
		pciutils \
		run-postinsts \
		udev-extraconf \
		packagegroup-core-boot \
		packagegroup-core-ssh-dropbear \
		tcf-agent \
		bridge-utils \
		launcher-driver \
		"
EXTRA_USERS_PARAMS ?= "usermod -P root root;useradd -P petalinux petalinux;"
